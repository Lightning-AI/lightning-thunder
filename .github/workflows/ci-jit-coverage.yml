name: CI jit coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/ci-jit-coverage.yml"
      - ".github/load-jit-coverage-report.py"
      - "examples/coverage/*"
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *" # every midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  NUM_SHARDS: 4

jobs:
  jit-coverage:
    # models are built on the meta device and traced with the pytorch executor, so no GPU is needed
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          # the CUDA-only extras are not needed for tracing on CPU
          grep -vE "nvfuser|cudnn" examples/coverage/requirements.txt > requirements-cpu.txt
          pip install -e . -U -r requirements-cpu.txt --extra-index-url="https://download.pytorch.org/whl/cpu"
          pip list

      - name: Run thunder.jit coverage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          grep -vE '^\s*(#|$)' examples/coverage/all.txt | awk -v n="$NUM_SHARDS" -v s="${{ matrix.shard }}" 'NR % n == s' > shard.txt
          wc -l shard.txt
          python examples/coverage/jit_coverage_hf.py \
            --models-file shard.txt --output-dir data --results-file shard-${{ matrix.shard }}.json \
            --num-workers "$(nproc)"
          python .github/load-jit-coverage-report.py shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-coverage-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            data/
          if-no-files-found: ignore

  report:
    needs: jit-coverage
    if: always()
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: jit-coverage-shard-*
          merge-multiple: true

      - name: Load report
        id: load-report
        run: |
          python -c "import glob, json; json.dump([r for f in sorted(glob.glob('shard-*.json')) for r in json.load(open(f))], open('jit_coverage_report.json', 'w'))"
          report=$(python .github/load-jit-coverage-report.py)
          echo "$report"
          echo "REPORT<<EOF" >> $GITHUB_ENV
          echo "$report" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: act10ns/slack@v2
        if: always() && github.event_name != 'pull_request'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ needs.jit-coverage.result }}
          message: |
            *thunder.jit coverage CI* - [${{ needs.jit-coverage.result }}]
            ${{ env.REPORT }}
            ref: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
