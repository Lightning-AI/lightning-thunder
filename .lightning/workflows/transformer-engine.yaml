trigger:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

timeout: "30" # minutes
machine: "L4"
interruptible: False
image: "pytorchlightning/lightning-thunder:ubuntu24.04-cuda12.8.1-cudnn-fe1.15.0-py3.12-pt_2.8.0-dev"
parametrize:
  matrix:
    test_file:
      - test_transformer_engine_executor.py

run: |
  whereis nvidia
  nvidia-smi
  pip list
  set -ex

  pip install wheel
  # conda install -c conda-forge libstdcxx-ng
  # sudo apt install libstdc++6 libstdc++-*-dev
  pip install . -U -q -r requirements/test.txt
  # Need to explicitly point to cudnn.h as it is installed at a non-standard location
  # Ref: https://github.com/NVIDIA/TransformerEngine/issues/918#issuecomment-2187703769
  # Capped at 2.16: no TE release ships a cu128 wheel for torch 2.8, so this always builds from
  # source, and from 2.17 on that build needs c10d/symm_mem/nccl_dev_cap.hpp, which torch 2.8 (this
  # image) does not have. Raise the cap when the image's torch moves.
  CPLUS_INCLUDE_PATH="/usr/local/lib/python3.12/dist-packages/nvidia/cudnn/include/" pip install --no-build-isolation 'transformer_engine[pytorch]<=2.16'
  pip list # for debugging purposes
  pytest thunder/tests/${test_file} -v -rs
