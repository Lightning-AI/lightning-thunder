trigger:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

timeout: "50" # minutes
machine: "L4"
interruptible: False
parametrize:
  matrix:
    image:
      - "pytorchlightning/lightning-thunder:ubuntu24.04-cuda12.8.1-cudnn-fe1.15.0-py3.12-pt_2.8.0-dev"
      - "pytorchlightning/lightning-thunder:ubuntu24.04-cuda12.8.1-cudnn-fe1.15.0-py3.12-pt_main-dev"
  exclude: []
  include: []

run: |
  whereis nvidia
  nvidia-smi
  python --version
  pip --version
  pip list
  set -ex

  # drop pt from requirements so not to interfere with the existing one
  bash scripts/remove-torch-lines.sh requirements/base.txt
  cat requirements/base.txt
  # double check on test requirements
  # Some of the image's Python packages come from its apt layer, so they have no RECORD file and
  # pip cannot uninstall them to make way for a newer version. Ask pip what it plans to change and
  # hand it its own copy of just those packages first. Only the ones actually being upgraded: apt
  # also ships C extensions with no PyPI wheel (dbus-python, PyGObject) that cannot build here.
  # Custom builds (torch, nvfuser) are skipped -- replacing the image's torch breaks nvfuser.
  pip install -q -U --dry-run --report /tmp/plan.json -r requirements/base.txt -r requirements/notebooks.txt
  python - <<'EOF' > /tmp/apt-owned.txt
  import importlib.metadata as md, json, re

  canon = lambda n: re.sub(r"[-_.]+", "-", n).lower()
  planned = {canon(e["metadata"]["name"]) for e in json.load(open("/tmp/plan.json"))["install"]}
  keep = {"lightning-thunder", "torch", "nvfuser"}

  seen = set()
  for dist in md.distributions():
      name, version = dist.metadata["Name"], dist.version
      if not name or "+" in version or canon(name) in keep | seen:
          continue
      if canon(name) in planned and dist.read_text("RECORD") is None:
          seen.add(canon(name))
          print(f"{name}=={version}")
  EOF
  cat /tmp/apt-owned.txt
  [ -s /tmp/apt-owned.txt ] && pip install -q --ignore-installed -r /tmp/apt-owned.txt
  pip install -q -U -r requirements/base.txt -r requirements/notebooks.txt
  # install this package
  pip install -e .

  bash scripts/sanity-check.sh

  # list all notebooks in this folder
  cd notebooks/
  find . -name "*.ipynb" > all.txt
  # drop all "./" from beginning of each line
  sed -i 's/^\.\///' all.txt
  # filter out the ones that are listed in .ignore.ci
  grep -Fxv -f .ignore.ci all.txt > ci.txt
  # iterate over all listed notebooks and execute them with jupyter
  while read -r line; do
      echo "Processing $line"
      jupyter execute $line --timeout=450
  done <<< $(cat ci.txt)
