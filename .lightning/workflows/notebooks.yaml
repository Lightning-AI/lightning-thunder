trigger:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

timeout: "50" # minutes
machine: "L4"
interruptible: False
parametrize:
  matrix:
    image:
      - "pytorchlightning/lightning-thunder:ubuntu24.04-cuda12.8.1-cudnn-fe1.15.0-py3.12-pt_2.8.0-dev"
      - "pytorchlightning/lightning-thunder:ubuntu24.04-cuda12.8.1-cudnn-fe1.15.0-py3.12-pt_main-dev"
  exclude: []
  include: []

run: |
  whereis nvidia
  nvidia-smi
  python --version
  pip --version
  pip list
  set -ex

  # drop pt from requirements so not to interfere with the existing one
  bash scripts/remove-torch-lines.sh requirements/base.txt
  cat requirements/base.txt
  # double check on test requirements
  # Some packages come from the image's apt layer (PyJWT, cryptography, ...). Those have no
  # RECORD file, so pip cannot replace them when the install below wants a newer version. Give
  # pip its own copies at the same versions first. Custom builds (torch, nvfuser -- local
  # versions like 2.12.0a0+git044db10) are skipped: they are not on PyPI and must not be touched.
  python - <<'EOF' > /tmp/apt-owned.txt
  import importlib.metadata as md

  for dist in md.distributions():
      name, version = dist.metadata["Name"], dist.version
      if not name or "+" in version or name.lower() in {"lightning-thunder", "torch", "nvfuser"}:
          continue
      if dist.read_text("RECORD") is None:
          print(f"{name}=={version}")
  EOF
  cat /tmp/apt-owned.txt
  [ -s /tmp/apt-owned.txt ] && pip install -q --ignore-installed -r /tmp/apt-owned.txt
  pip install -q -U -r requirements/base.txt -r requirements/notebooks.txt
  # install this package
  pip install -e .

  bash scripts/sanity-check.sh

  # list all notebooks in this folder
  cd notebooks/
  find . -name "*.ipynb" > all.txt
  # drop all "./" from beginning of each line
  sed -i 's/^\.\///' all.txt
  # filter out the ones that are listed in .ignore.ci
  grep -Fxv -f .ignore.ci all.txt > ci.txt
  # iterate over all listed notebooks and execute them with jupyter
  while read -r line; do
      echo "Processing $line"
      jupyter execute $line --timeout=450
  done <<< $(cat ci.txt)
